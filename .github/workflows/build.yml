name: macOS build and tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test pitch detection and exercises
        run: swift test
      - name: Package local app
        run: bash scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --keepParent "$HOME/Applications/FretNote.app" dist/FretNote.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FretNote-macOS
          path: dist/FretNote.zip
